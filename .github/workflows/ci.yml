name: CI

on:
  pull_request:
    branches:
      - main
      - renovate-github/**
  push:

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate
        uses: rinchsan/renovate-config-validator@v0.2.1
